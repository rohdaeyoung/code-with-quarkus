<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>앰베사 상세</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      background-color: #0a0e17;
      color: white;
      padding: 1.5rem;
      font-family: 'Segoe UI', sans-serif;
    }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item {
      background: transparent;
      border-color: #444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row g-4">
      <div class="col-lg-5 text-center">
        <img src="https://ddragon.leagueoflegends.com/cdn/15.24.1/img/champion/Ambessa.png"
             class="img-fluid rounded shadow-lg" alt="앰베사"
             style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1">앰베사 (Ambessa)</h3>
          <p class="text-muted fs-5">탑/미드 / 난이도: 상</p>
        </div>
      </div>
      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item">패시브: 전쟁의 어머니</li>
          <li class="list-group-item">Q: 포식자의 본능</li>
          <li class="list-group-item">W: 강인함</li>
          <li class="list-group-item">E: 그랜드마스터의 검</li>
          <li class="list-group-item">R: 필승의 의지</li>
        </ul>
        <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
          녹서스 제국의 전설적인 전쟁 지도자 앰베사 메달라단.
          권력과 정복을 향한 냉혹한 야망으로 전장을 지배해온 그녀는
          아케인에서 등장한 강력한 챔피언이다.
          딸 멜과의 갈등 속에서도 자신의 신념을 굽히지 않는 철의 여인이다.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
