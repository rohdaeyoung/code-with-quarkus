<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나아피리 상세</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      background-color: #0a0e17;
      color: white;
      padding: 1.5rem;
      font-family: 'Segoe UI', sans-serif;
    }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item {
      background: transparent;
      border-color: #444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row g-4">
      <div class="col-lg-5 text-center">
        <img src="https://ddragon.leagueoflegends.com/cdn/15.24.1/img/champion/Naafiri.png"
             class="img-fluid rounded shadow-lg" alt="나아피리"
             style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1">나아피리 (Naafiri)</h3>
          <p class="text-muted fs-5">미드 / 난이도: 하</p>
        </div>
      </div>
      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item">패시브: 우리는 하나</li>
          <li class="list-group-item">Q: 단검 투척</li>
          <li class="list-group-item">W: 포식자의 추적</li>
          <li class="list-group-item">E: 급습</li>
          <li class="list-group-item">R: 우두머리의 부름</li>
        </ul>
        <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
          다르킨의 영혼이 깃든 단검 속에서 깨어난 나아피리.
          개들의 무리를 이끌며 먹잇감을 집요하게 추적하는 암살자다.
          무리와 함께 움직이는 독특한 플레이 스타일로
          미드 라인에서 강력한 암살을 시도한다.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
