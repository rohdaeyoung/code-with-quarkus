<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오로라 상세</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      background-color: #0a0e17;
      color: white;
      padding: 1.5rem;
      font-family: 'Segoe UI', sans-serif;
    }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item {
      background: transparent;
      border-color: #444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row g-4">
      <div class="col-lg-5 text-center">
        <img src="https://ddragon.leagueoflegends.com/cdn/15.24.1/img/champion/Aurora.png"
             class="img-fluid rounded shadow-lg" alt="오로라"
             style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1">오로라 (Aurora)</h3>
          <p class="text-muted fs-5">미드/탑 / 난이도: 중</p>
        </div>
      </div>
      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item">패시브: 영혼의 연결</li>
          <li class="list-group-item">Q: 공허의 손길</li>
          <li class="list-group-item">W: 반향</li>
          <li class="list-group-item">E: 차원 도약</li>
          <li class="list-group-item">R: 사이 사이</li>
        </ul>
        <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
          프렐요드 부족 출신의 오로라는 현실과 영혼 세계를 자유롭게 오가는 능력을 지닌 마법사다.
          두 세계의 경계에서 살아온 그녀는 그 힘을 전투에 활용하여
          적을 혼란에 빠뜨리고 차원을 넘나드는 독특한 전투 스타일을 구사한다.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
