<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스몰더 상세</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body {
      background-color: #0a0e17;
      color: white;
      padding: 1.5rem;
      font-family: 'Segoe UI', sans-serif;
    }
    h3, h4 { color: #c8aa6e; }
    .text-muted { color: #a0a0a0 !important; }
    .list-group-item {
      background: transparent;
      border-color: #444;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row g-4">
      <div class="col-lg-5 text-center">
        <img src="https://ddragon.leagueoflegends.com/cdn/15.24.1/img/champion/Smolder.png"
             class="img-fluid rounded shadow-lg" alt="스몰더"
             style="max-height: 480px; object-fit: contain;">
        <div class="mt-3">
          <h3 class="mb-1">스몰더 (Smolder)</h3>
          <p class="text-muted fs-5">원딜 / 난이도: 중</p>
        </div>
      </div>
      <div class="col-lg-7">
        <h4 class="border-bottom border-secondary pb-2 mb-3">스킬</h4>
        <ul class="list-group list-group-flush mb-4">
          <li class="list-group-item">패시브: 드래곤의 화염</li>
          <li class="list-group-item">Q: 슈퍼 슬래머 슬램!</li>
          <li class="list-group-item">W: 날아오르는 화염</li>
          <li class="list-group-item">E: 역겨운 냄새!</li>
          <li class="list-group-item">R: 마마의 포옹</li>
        </ul>
        <h4 class="border-bottom border-secondary pb-2 mb-3">배경 스토리 요약</h4>
        <p class="text-secondary lh-lg">
          아직 어리지만 강한 용기를 지닌 드래곤 스몰더.
          엄마 드래곤의 품을 벗어나 모험을 시작한 그는
          성장하며 점점 더 강력한 화염을 내뿜는다.
          귀여운 외모와 달리 전장에서 무시무시한 화염 공격을 퍼붓는 원거리 딜러다.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
